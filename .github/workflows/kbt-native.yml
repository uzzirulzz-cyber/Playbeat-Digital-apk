name: KBT Operations — Native Android APK
on:
  push:
    branches: ["feat/kbt-operations"]
    paths:
      - kbt-android-src.tar.xz
      - .github/workflows/kbt-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Native Android 17 Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 17 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Extract native Kotlin sources
        run: tar -xJf kbt-android-src.tar.xz
      - name: Assemble native debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify actual package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -10
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk KBT-Operations.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KBT-Operations-APK
          path: KBT-Operations.apk
          if-no-files-found: error
          retention-days: 30

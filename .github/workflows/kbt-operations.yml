name: Build KBT Operations APK
on:
  push:
    branches: [kbt-operations-android]
    paths: ['kbt-operations/**', '.github/workflows/kbt-operations.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble debug installable APK
        working-directory: kbt-operations
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature and checksum
        working-directory: kbt-operations
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk KBT-Operations.apk
          sha256sum KBT-Operations.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KBT-Operations-Android-APK
          path: kbt-operations/KBT-Operations.apk
          if-no-files-found: error
      - name: Publish downloadable preview APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kbt-operations-preview-v1
          name: KBT Operations — Android preview v1
          prerelease: true
          files: kbt-operations/KBT-Operations.apk

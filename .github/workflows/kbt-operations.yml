name: Build KBT Operations APK
on:
  push:
    branches: [kbt-operations-android]
    paths: ['kbt-operations/**', '.github/workflows/kbt-operations.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble debug installable APK
        working-directory: kbt-operations
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KBT-Operations-Android-APK
          path: kbt-operations/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
